<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片瘦身 PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        #preview { max-width: 100%; margin-top: 15px; display: none; border-radius: 8px; }
        button, label { background: #007bff; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; border: none; margin-top: 10px; display: inline-block; }
        #downloadBtn { background: #28a745; display: none; text-decoration: none; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>图片处理器</h2>
    <p>自动调整宽度至 1240px 并清除 EXIF</p>
    
    <input type="file" id="upload" accept="image/jpeg">
    <label for="upload">选择 JPG 图片</label>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview" alt="预览">
    
    <a id="downloadBtn">下载处理后的图片</a>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');

    upload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const ctx = canvas.getContext('2d');
                
                // 1. 计算比例，设置宽度为 1240
                const targetWidth = 1240;
                const scale = targetWidth / img.width;
                const targetHeight = img.height * scale;

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // 2. 绘图到 Canvas (此过程会自动丢弃原始 EXIF 信息)
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                // 3. 生成文件名: IMG_YYYYMM_DDHHMMSS.jpg
                const now = new Date();
                const timestamp = now.getFullYear() + 
                                  String(now.getMonth() + 1).padStart(2, '0') + "_" +
                                  String(now.getDate()).padStart(2, '0') + 
                                  String(now.getHours()).padStart(2, '0') + 
                                  String(now.getMinutes()).padStart(2, '0') + 
                                  String(now.getSeconds()).padStart(2, '0');
                const fileName = `IMG_${timestamp}.jpg`;

                // 4. 转为 DataURL 并准备下载
                const processedUrl = canvas.toDataURL('image/jpeg', 0.9);
                preview.src = processedUrl;
                preview.style.display = 'block';
                
                downloadBtn.href = processedUrl;
                downloadBtn.download = fileName;
                downloadBtn.style.display = 'inline-block';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 注册 Service Worker 使其成为 PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed', err));
        });
    }
</script>
</body>
</html>
