<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片处理工具</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #0070f3; --success: #0070f3; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #fafafa; color: #333; }
        .container { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); max-width: 450px; width: 100%; text-align: center; }
        .input-group { margin: 20px 0; text-align: left; }
        label { font-size: 14px; font-weight: 600; color: #666; display: block; margin-bottom: 8px; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .upload-area { border: 2px dashed #ddd; padding: 20px; border-radius: 12px; cursor: pointer; transition: border 0.3s; }
        .upload-area:hover { border-color: var(--primary); }
        #preview { max-width: 100%; margin-top: 20px; border-radius: 8px; display: none; border: 1px solid #eee; }
        .btn { background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; cursor: pointer; border: none; margin-top: 15px; display: none; text-decoration: none; font-weight: 500; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>图片瘦身工具</h2>
    
    <div class="input-group">
        <label>目标宽度 (px)</label>
        <input type="number" id="targetWidth" value="1280" placeholder="例如: 1280">
    </div>

    <div class="upload-area" onclick="document.getElementById('upload').click()">
        <p id="tip">点击或拖入 JPG/PNG 图片</p>
        <input type="file" id="upload" accept="image/jpeg,image/png">
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview">
    
    <a id="downloadBtn" class="btn">下载处理后的图片</a>
</div>

<script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    const widthInput = document.getElementById('targetWidth');

    let currentObjectURL = null;

    function processImage() {
        const file = upload.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const ctx = canvas.getContext('2d');
                
                // 1. 获取手动设置的宽度
                const targetWidth = parseInt(widthInput.value) || img.width;
                const scale = targetWidth / img.width;
                const targetHeight = img.height * scale;

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                // 2. 填充白色背景（兼容 PNG 透明底转 JPG 不变黑）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, targetWidth, targetHeight);
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                // 3. 生成精确文件名 (.jpg)
                const now = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                
                const year = now.getFullYear();
                const month = pad(now.getMonth() + 1);
                const day = pad(now.getDate());
                const hours = pad(now.getHours());
                const minutes = pad(now.getMinutes());
                const seconds = pad(now.getSeconds());

                const fileName = `IMG_${year}${month}${day}_${hours}${minutes}${seconds}.jpg`;

                // 4. 预览图显示
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                preview.src = dataUrl;
                preview.style.display = 'block';

                // 5. 释放之前的内存对象
                if (currentObjectURL) {
                    URL.revokeObjectURL(currentObjectURL);
                }

                // 6. 生成包装了文件名的 File Blob 对象
                canvas.toBlob((blob) => {
                    const imageFile = new File([blob], fileName, { type: 'image/jpeg' });
                    currentObjectURL = URL.createObjectURL(imageFile);

                    downloadBtn.href = currentObjectURL;
                    downloadBtn.download = fileName;
                    downloadBtn.style.display = 'inline-block';
                    document.getElementById('tip').innerText = "已选择: " + file.name;
                }, 'image/jpeg', 0.9);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    // 监听文件上传和宽度变化
    upload.addEventListener('change', processImage);
    widthInput.addEventListener('change', processImage);

    // 简单的 PWA 注册
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
